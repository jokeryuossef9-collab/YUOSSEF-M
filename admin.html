<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة التحكم | YUOSSEF&M</title>
    <meta name="description" content="لوحة تحكم إدارة موقع YUOSSEF&M">
    <meta name="theme-color" content="#05040a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Y&M Admin">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/ncJ7Gn26/AIRetouch-20261101-055625224.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Y&M Admin","short_name":"Admin","start_url":"./admin.html","display":"standalone","orientation":"portrait","background_color":"%2305040a","theme_color":"%2339ff14","icons":[{"src":"https://i.postimg.cc/ncJ7Gn26/AIRetouch-20261101-055625224.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"https://i.postimg.cc/ncJ7Gn26/AIRetouch-20261101-055625224.png","sizes":"512x512","type":"image/png","purpose":"any"}]}'>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #05040a;
            --bg-card: #110e1a;
            --bg-input: #0a0812;
            --primary: #39ff14;
            --primary-hover: #28cc0d;
            --accent-red: #e63946;
            --accent-purple: #7b2cbf;
            --text-white: #ffffff;
            --text-gray: #a0aab2;
            --border-color: #2a1f3d;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] { display: none !important; }

        html, body { min-height: 100vh; }

        body {
            background-color: var(--bg-main);
            background-image: linear-gradient(rgba(5, 4, 10, 0.9), rgba(5, 4, 10, 0.97)), url('https://i.postimg.cc/ZngMXCqn/Duck-ai-image-2026-11-01-04-02.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-white);
            max-width: 750px;
            margin: 0 auto;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            position: relative;
            overflow-x: hidden;
        }

        /* ===== Login ===== */
        .login-wrap {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(17, 14, 26, 0.88);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%; max-width: 400px;
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            width: 100px; height: 100px; object-fit: contain;
            display: block; margin: 0 auto 20px;
            filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.5));
            animation: floatLogo 3s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .login-title {
            text-align: center; font-size: 24px; font-weight: 900; margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), var(--accent-purple));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            text-align: center; color: var(--text-gray); font-size: 13px; margin-bottom: 30px;
        }
        .login-field { margin-bottom: 16px; }
        .login-field label {
            display: block; font-size: 12px; font-weight: 700;
            color: var(--text-gray); margin-bottom: 6px;
        }
        .login-field input {
            width: 100%; padding: 13px 15px; border-radius: 12px;
            background: var(--bg-input); border: 1px solid var(--border-color);
            color: var(--text-white); font-size: 14px; outline: none; transition: 0.3s;
        }
        .login-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }
        .login-err {
            color: var(--accent-red); font-size: 13px; margin-top: 15px;
            text-align: center; min-height: 20px; font-weight: 700;
        }

        /* ===== Header ===== */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background-color: rgba(5, 4, 10, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header-logo-area { display: flex; align-items: center; gap: 10px; }
        .header-logo {
            width: 45px; height: 45px; object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.4));
        }
        .header-title { font-size: 15px; font-weight: 900; color: var(--text-white); }
        .header-title span {
            display: block; font-size: 10px; font-weight: 600;
            color: var(--primary); margin-top: 2px;
        }
        .btn-logout {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid var(--accent-red); color: var(--accent-red);
            padding: 8px 14px; border-radius: 20px; font-size: 12px;
            font-weight: 700; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: 0.3s;
        }
        .btn-logout:hover { background: var(--accent-red); color: white; }

        /* ===== Nav ===== */
        .app-nav {
            display: flex; gap: 8px; padding: 12px 15px;
            overflow-x: auto; scrollbar-width: none;
            background: rgba(5, 4, 10, 0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 75px; z-index: 99;
        }
        .app-nav::-webkit-scrollbar { display: none; }
        .nav-chip {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-gray); padding: 9px 18px;
            border-radius: 20px; font-size: 13px; font-weight: 700;
            cursor: pointer; white-space: nowrap; display: flex;
            align-items: center; gap: 7px; transition: 0.3s; flex-shrink: 0;
        }
        .nav-chip i { font-size: 12px; }
        .nav-chip:hover { border-color: var(--primary); color: var(--primary); }
        .nav-chip.on {
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #000; border-color: var(--primary);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        /* ===== Main ===== */
        .app-main { padding: 20px 15px; }

        .page-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
        }
        .page-head-info { flex: 1; min-width: 0; }
        .page-title {
            font-size: 20px; font-weight: 900; color: var(--text-white);
            display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
        }
        .page-title::before {
            content: ''; width: 4px; height: 20px;
            background: var(--primary); border-radius: 2px;
        }
        .page-desc { font-size: 12px; color: var(--text-gray); line-height: 1.5; }

        .btn-add {
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #000; border: none; padding: 10px 18px; border-radius: 12px;
            font-size: 13px; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: 0.3s;
            box-shadow: 0 4px 20px rgba(57, 255, 20, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(57, 255, 20, 0.5);
        }

        /* Search */
        .search-box { margin-bottom: 15px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 40px 12px 15px; border-radius: 12px;
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-white); font-size: 13px; outline: none; transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }
        .search-box i {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--text-gray); font-size: 14px;
        }

        /* Item card */
        .item-card {
            background: rgba(17, 14, 26, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 12px; margin-bottom: 12px; display: flex;
            align-items: center; gap: 12px; transition: 0.3s;
        }
        .item-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.1);
            transform: translateY(-2px);
        }
        .item-thumb {
            width: 60px; height: 60px; border-radius: 12px;
            background: var(--bg-main); border: 1px solid var(--border-color);
            flex-shrink: 0; overflow: hidden; display: flex;
            align-items: center; justify-content: center;
            color: var(--text-gray); font-size: 22px;
        }
        .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-size: 14px; font-weight: 700; color: var(--text-white);
            margin-bottom: 4px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .item-meta {
            font-size: 11px; color: var(--text-gray);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .status-pill {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px; border-radius: 20px;
            font-size: 10px; font-weight: 700;
        }
        .status-pill.pub { background: rgba(57, 255, 20, 0.15); color: var(--primary); }
        .status-pill.hidden { background: rgba(230, 57, 70, 0.15); color: var(--accent-red); }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-icon-sm {
            width: 34px; height: 34px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--bg-main);
            color: var(--text-gray); cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 13px;
            transition: 0.3s;
        }
        .btn-icon-sm:hover {
            border-color: var(--primary); color: var(--primary);
            background: rgba(57, 255, 20, 0.05);
        }
        .btn-icon-sm.danger:hover {
            border-color: var(--accent-red); color: var(--accent-red);
            background: rgba(230, 57, 70, 0.05);
        }

        /* Empty */
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-gray); }
        .empty-state i {
            font-size: 50px; color: var(--border-color);
            margin-bottom: 15px; display: block;
        }
        .empty-state p { font-size: 14px; }

        /* Form */
        .form-card {
            background: rgba(17, 14, 26, 0.88);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 22px 18px; animation: fadeInUp 0.4s ease;
        }
        .form-title {
            font-size: 18px; font-weight: 900; color: var(--primary);
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
            padding-bottom: 15px; border-bottom: 1px solid var(--border-color);
        }
        .field-group { margin-bottom: 18px; }
        .field-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 700; color: var(--text-white);
            margin-bottom: 6px;
        }
        .field-label i { color: var(--primary); font-size: 8px; }
        .field-help {
            font-size: 11px; color: var(--text-gray);
            margin-bottom: 8px; line-height: 1.5;
        }
        .field-input, .field-textarea, .field-select {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            background: var(--bg-input); border: 1px solid var(--border-color);
            color: var(--text-white); font-family: inherit; font-size: 13px;
            outline: none; transition: 0.3s;
        }
        .field-textarea { min-height: 80px; resize: vertical; }
        .field-select { appearance: none; -webkit-appearance: none; cursor: pointer; }
        .field-select option { background: var(--bg-main); color: white; }
        .field-input:focus, .field-textarea:focus, .field-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
        }
        .field-checkbox {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; background: var(--bg-input);
            border: 1px solid var(--border-color); border-radius: 10px;
            cursor: pointer; transition: 0.3s;
        }
        .field-checkbox:hover { border-color: var(--primary); }
        .field-checkbox input { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
        .field-checkbox span { font-size: 13px; font-weight: 700; }
        
        /* Image Upload Styles (Cover) */
        .img-upload-wrapper {
            background: var(--bg-input);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }
        .img-upload-wrapper:hover { border-color: var(--primary); }
        .btn-upload {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(57, 255, 20, 0.1); color: var(--primary);
            border: 1px solid var(--primary); padding: 10px 20px;
            border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .btn-upload:hover { background: var(--primary); color: #000; }
        .or-divider { font-size: 11px; color: var(--text-gray); margin: 10px 0; }
        .field-preview {
            margin-top: 15px; max-width: 100%; max-height: 250px;
            border-radius: 10px; border: 1px solid var(--border-color);
            object-fit: cover; display: none; width: 100%;
        }
        .field-preview.visible { display: inline-block; width: auto; }
        .upload-status { font-size: 12px; font-weight: 700; margin-top: 10px; display: block; }

        /* Gallery Upload Styles (Multiple) */
        .gallery-upload-wrapper {
            background: var(--bg-input);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .gallery-previews {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .gallery-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
        }
        .gallery-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .btn-remove-thumb {
            position: absolute; top: 4px; left: 4px;
            background: var(--accent-red); color: white;
            border: none; width: 24px; height: 24px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .btn-remove-thumb:hover { transform: scale(1.1); }

        /* URL row for gallery */
        .gallery-url-row {
            display: flex; gap: 8px; align-items: stretch;
            margin-top: 6px;
        }
        .gallery-url-row .field-input {
            flex: 1; padding: 10px 12px; font-size: 12px;
        }
        .gallery-url-row .btn-upload {
            padding: 10px 15px; white-space: nowrap; font-size: 12px;
        }

        .form-actions {
            display: flex; gap: 10px; margin-top: 24px;
            padding-top: 18px; border-top: 1px solid var(--border-color);
        }
        .btn-save {
            flex: 1;
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #000; border: none; padding: 14px; border-radius: 12px;
            font-size: 14px; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: 0.3s;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(57, 255, 20, 0.4);
        }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-cancel {
            padding: 14px 20px; background: transparent;
            border: 1px solid var(--border-color); color: var(--text-gray);
            border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .btn-cancel:hover { border-color: var(--accent-red); color: var(--accent-red); }

        .btn-primary-lg {
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #000; border: none; padding: 14px; border-radius: 12px;
            font-size: 15px; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 10px; transition: 0.3s;
        }
        .btn-primary-lg:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(57, 255, 20, 0.4);
        }
        .btn-primary-lg:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(200%);
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #000; padding: 12px 24px; border-radius: 30px;
            font-weight: 900; font-size: 13px; z-index: 9999;
            box-shadow: 0 8px 30px rgba(57, 255, 20, 0.4);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; gap: 8px; max-width: 90%;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.err {
            background: linear-gradient(90deg, var(--accent-red), #b32d38);
            color: white;
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.4);
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            z-index: 1000; display: flex; justify-content: center;
            align-items: center; padding: 20px;
        }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--accent-red);
            border-radius: 20px; padding: 28px 22px; max-width: 380px;
            width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(230, 57, 70, 0.2);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(230, 57, 70, 0.15); color: var(--accent-red);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 16px;
        }
        .modal-title { font-size: 18px; font-weight: 900; margin-bottom: 8px; }
        .modal-text {
            font-size: 13px; color: var(--text-gray);
            margin-bottom: 22px; line-height: 1.5;
        }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button {
            flex: 1; padding: 12px; border-radius: 10px;
            font-weight: 900; font-size: 13px; cursor: pointer;
            border: none; transition: 0.3s;
        }
        .modal-actions .yes { background: var(--accent-red); color: white; }
        .modal-actions .no {
            background: var(--bg-main); border: 1px solid var(--border-color);
            color: var(--text-white);
        }

        /* Loader */
        .loader {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 50px;
            color: var(--text-gray); gap: 15px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Settings */
        .settings-section { margin-bottom: 22px; }
        .settings-section h4 {
            font-size: 13px; color: var(--primary); font-weight: 900;
            margin-bottom: 12px; display: flex; align-items: center;
            gap: 8px; padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        @media (max-width: 480px) {
            .app-main { padding: 15px 12px; }
            .form-card { padding: 18px 14px; }
            .page-title { font-size: 18px; }
            .login-card { padding: 32px 20px; }
            .item-thumb { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="login-wrap">
    <div class="login-card">
        <img src="https://i.postimg.cc/ncJ7Gn26/AIRetouch-20261101-055625224.png" class="login-logo" alt="Logo">
        <h1 class="login-title">YUOSSEF&M Admin</h1>
        <p class="login-subtitle">لوحة التحكم — سجّل دخولك للمتابعة</p>

        <div class="login-field">
            <label><i class="fas fa-envelope" style="color: var(--primary); margin-left: 5px;"></i> البريد الإلكتروني</label>
            <input id="em" type="email" placeholder="you@example.com" autocomplete="email" dir="ltr">
        </div>

        <div class="login-field">

    // ==========================================
    // أدوات مساعدة
    // ==========================================
    function toast(msg, ok = true) {
        let el = document.getElementById('toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'toast';
            el.className = 'toast';
            document.body.appendChild(el);
        }
        el.innerHTML = `<i class="fas fa-${ok ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
        el.className = 'toast' + (ok ? '' : ' err');
        requestAnimationFrame(() => el.classList.add('show'));
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function showLoading() {
        $('#main').innerHTML = '<div class="loader"><div class="spinner"></div><span>جاري التحميل...</span></div>';
    }

    // ==========================================
    // تطبيع رابط الصورة (إضافة https لو ناقص)
    // ==========================================
    function normalizeImageUrl(url) {
        let v = String(url || '').trim();
        if (!v) return '';
        if (v.startsWith('data:')) return v;
        if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
        return v;
    }

    // ==========================================
    // دالة رفع صورة مفردة (للغلاف)
    // ==========================================
    async function uploadImage(fileInput, fieldKey) {
        const file = fileInput.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) {
            toast('✗ حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)', false);
            fileInput.value = '';
            return;
        }

        const statusEl = document.getElementById(`upload-status-${fieldKey}`);
        const inputEl = document.getElementById(`input-${fieldKey}`);
        const previewEl = document.getElementById(`preview-${fieldKey}`);

        statusEl.innerHTML = '<span style="color: var(--primary);"><i class="fas fa-spinner fa-spin"></i> جاري رفع الصورة...</span>';

        const fileExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
        const filePath = `uploads/${fileName}`;

        const { data, error } = await sb.storage
            .from('images')
            .upload(filePath, file, { cacheControl: '3600', upsert: false });

        if (error) {
            statusEl.innerHTML = '<span style="color: var(--accent-red);"><i class="fas fa-times"></i> فشل الرفع</span>';
            toast('✗ خطأ في الرفع: ' + error.message, false);
            fileInput.value = '';
            return;
        }

        const { data: publicUrlData } = sb.storage
            .from('images')
            .getPublicUrl(filePath);

        const publicUrl = publicUrlData.publicUrl;

        inputEl.value = publicUrl;
        previewEl.src = publicUrl;
        previewEl.classList.add('visible');

        statusEl.innerHTML = '<span style="color: var(--primary);"><i class="fas fa-check"></i> تم الرفع بنجاح</span>';
        setTimeout(() => statusEl.innerHTML = '', 3000);
    }

    // ==========================================
    // دوال رفع صور المعرض المتعددة
    // ==========================================
    async function uploadGalleryImages(fileInput, fieldKey) {
        const files = fileInput.files;
        if (!files.length) return;

        const statusEl = document.getElementById(`upload-status-${fieldKey}`);
        statusEl.innerHTML = '<span style="color: var(--primary);"><i class="fas fa-spinner fa-spin"></i> جاري رفع الصور...</span>';

        let uploadedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.size > 5 * 1024 * 1024) {
                toast(`✗ الصورة ${file.name} أكبر من 5 ميجا وتم تخطيها`, false);
                continue;
            }

            const fileExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
            const filePath = `uploads/${fileName}`;

            const { error } = await sb.storage
                .from('images')
                .upload(filePath, file, { cacheControl: '3600', upsert: false });

            if (!error) {
                const { data: publicUrlData } = sb.storage.from('images').getPublicUrl(filePath);
                tempGallery.push(publicUrlData.publicUrl);
                uploadedCount++;
            }
        }

        fileInput.value = '';
        statusEl.innerHTML = `<span style="color: var(--primary);"><i class="fas fa-check"></i> تم رفع ${uploadedCount} صورة بنجاح</span>`;
        setTimeout(() => statusEl.innerHTML = '', 3000);
        
        renderGalleryPreviews(fieldKey);
    }

    // ==========================================
    // إضافة صورة للمعرض عبر رابط
    // ==========================================
    function addGalleryUrl(fieldKey) {
        const input = document.getElementById(`gallery-url-${fieldKey}`);
        if (!input) return;

        let url = input.value.trim();
        if (!url) {
            toast('من فضلك أدخل رابط الصورة', false);
            return;
        }

        url = normalizeImageUrl(url);

        if (!/^https?:\/\/.+\..+/i.test(url) && !url.startsWith('data:')) {
            toast('الرابط غير صالح', false);
            return;
        }

        if (tempGallery.includes(url)) {
            toast('هذا الرابط مضاف بالفعل', false);
            return;
        }

        tempGallery.push(url);
        input.value = '';
        renderGalleryPreviews(fieldKey);
        toast('✔ تمت إضافة الصورة من الرابط');
    }

    function renderGalleryPreviews(fieldKey) {
        const container = document.getElementById(`gallery-previews-${fieldKey}`);
        if (!container) return;

        if (tempGallery.length === 0) {
            container.innerHTML = '<p style="font-size:12px;color:var(--text-gray);">لا توجد صور في المعرض.</p>';
            return;
        }

        container.innerHTML = tempGallery.map((url, index) => `
            <div class="gallery-thumb">
                <img src="${esc(url)}" onerror="this.src='https://i.postimg.cc/ncJ7Gn26/AIRetouch-20261101-055625224.png'">
                <button type="button" class="btn-remove-thumb" onclick="removeGalleryImage('${fieldKey}', ${index})" title="حذف الصورة">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `).join('');
    }

    function removeGalleryImage(fieldKey, index) {
        if (!confirm('هل أنت متأكد من إزالة هذه الصورة من المعرض؟')) return;
        tempGallery.splice(index, 1);
        renderGalleryPreviews(fieldKey);
    }

                ${fieldsHtml}
                <div class="form-actions">
                    <button class="btn-cancel" onclick="load()">رجوع</button>
                    <button class="btn-save" onclick="save(${id || 'null'}, this)">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                </div>
            </div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // عرض صور المعرض المحفوظة مسبقاً
        if (cur === 'projects') {
            renderGalleryPreviews('gallery');
        }

        document.querySelectorAll('.field-checkbox input').forEach(cb => {
            cb.addEventListener('change', function() {
                this.nextElementSibling.textContent = this.checked ? 'مفعّل' : 'معطّل';
            });
        });
    }

    function updatePreview(input, key) {
        const img = document.getElementById('preview-' + key);
        if (!img) return;
        const v = input.value.trim();
        if (v) {
            img.src = normalizeImageUrl(v);
            img.classList.add('visible');
        } else {
            img.classList.remove('visible');
        }
    }

    async function save(id, btn) {
        const obj = {};
        for (const el of document.querySelectorAll('[data-k]')) {
            const k = el.dataset.k, t = el.dataset.t, v = el.value;
            
            if (t === 'gallery') {
                obj[k] = tempGallery;
                continue;
            }

            if (el.type === 'checkbox') obj[k] = el.checked;
            else if (t === 'num') obj[k] = Number(v) || 0;
            else if (t === 'list') obj[k] = v.split('\n').map(s => s.trim()).filter(Boolean);
            else if (t === 'json') {
                try { obj[k] = JSON.parse(v || '[]'); }
                catch (e) { return toast('✗ خطأ في JSON في حقل: ' + k, false); }
            } else {
                // تطبيع روابط الصور المفردة
                const val = v.trim();
                if (val && (k === 'cover_image' || k === 'image' || k.endsWith('_image'))) {
                    obj[k] = normalizeImageUrl(val);
                } else {
                    obj[k] = val === '' ? null : v;
                }
            }
        }

        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...'; }

        const res = id
            ? await sb.from(cur).update(obj).eq('id', id)
            : await sb.from(cur).insert(obj);

        if (res.error) {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> حفظ'; }
            return toast('✗ ' + res.error.message, false);
        }
        toast(id ? '✔ تم التحديث بنجاح' : '✔ تمت الإضافة بنجاح');
        load();
    }

    // ==========================================
    // الحذف
    // ==========================================
    function confirmDelete(id) {
        deleteTargetId = id;
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'deleteModal';
        modal.innerHTML = `
            <div class="modal-box">
                <div class="modal-icon"><i class="fas fa-trash"></i></div>
                <h3 class="modal-title">تأكيد الحذف</h3>
                <p class="modal-text">هل أنت متأكد من حذف هذا العنصر؟<br>لا يمكن التراجع عن هذه الخطوة.</p>
                <div class="modal-actions">
                    <button class="no" onclick="closeDeleteModal()">إلغاء</button>
                    <button class="yes" onclick="doDelete()">حذف نهائي</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
    }

    function closeDeleteModal() {
        const m = document.getElementById('deleteModal');
        if (m) m.remove();
        deleteTargetId = null;
    }

    async function doDelete() {
        if (!deleteTargetId) return;
        const id = deleteTargetId;
        closeDeleteModal();
        const { error } = await sb.from(cur).delete().eq('id', id);
        if (error) return toast('✗ ' + error.message, false);
        toast('✔ تم الحذف');
        load();
    }

    // ==========================================
    // الإعدادات
    // ==========================================
    async function settingsView() {
        showLoading();
        const { data } = await sb.from('site_settings').select('*');
        const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));

        const groupsHtml = SETTINGS_GROUPS.map(g => `
            <div class="settings-section">
                <h4><i class="fas ${g.icon}"></i> ${g.title}</h4>
                ${g.fields.map(([k, l, t, opts, help]) => {
                    const v = s[k] ?? '';
                    const helpHtml = help ? `<p class="field-help">${help}</p>` : '';
                    const input = t === 'area'
                        ? `<textarea class="field-textarea" data-k="${k}">${esc(v)}</textarea>`
                        : `<input class="field-input" data-k="${k}" value="${esc(v)}">`;
                    return `<div class="field-group">
                        <label class="field-label"><i class="fas fa-circle"></i> ${l}</label>
                        ${helpHtml}${input}
                    </div>`;
                }).join('')}
            </div>`).join('');

        $('#main').innerHTML = `
            <div class="page-head">
                <div class="page-head-info">
                    <h2 class="page-title">الإعدادات</h2>
                    <p class="page-desc">التحكم في نصوص الموقع وبيانات التواصل وروابط السوشيال ميديا.</p>
                </div>
            </div>
            <div class="form-card">
                ${groupsHtml}
                <button class="btn-primary-lg" onclick="saveSettings(this)">
                    <i class="fas fa-save"></i> حفظ الإعدادات
                </button>
            </div>`;
    }

    async function saveSettings(btn) {
        const list = [...document.querySelectorAll('[data-k]')].map(el => ({
            key: el.dataset.k, value: el.value
        }));
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...'; }
        const { error } = await sb.from('site_settings').upsert(list);
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> حفظ الإعدادات'; }
        toast(error ? '✗ ' + error.message : '✔ تم حفظ الإعدادات', !error);
    }

    // ==========================================
    // تسجيل الدخول والخروج
    // ==========================================
    $('#loginBtn').onclick = async () => {
        const btn = $('#loginBtn');
        const email = $('#em').value.trim();
        const pw = $('#pw').value;
        
        if (!email || !pw) {
            $('#err').textContent = 'من فضلك أدخل الإيميل وكلمة المرور';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
        $('#err').textContent = '';

        try {
            const { error } = await sb.auth.signInWithPassword({ email, password: pw });
            
            if (error) {
                $('#err').textContent = error.message;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            } else {
                await checkAuth();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        } catch (err) {
            $('#err').textContent = 'حدث خطأ في الاتصال، جرب تاني.';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
        }
    };

    $('#pw').addEventListener('keypress', e => {
        if (e.key === 'Enter') $('#loginBtn').click();
    });

    $('#logout').onclick = async () => {
        if (!confirm('تسجيل الخروج؟')) return;
        await sb.auth.signOut();
        location.reload();
    };

    // ==========================================
    // تشغيل التطبيق
    // ==========================================
    sb.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            if (session) checkAuth();
        } else if (event === 'SIGNED_OUT') {
            checkAuth();
        }
    });

    checkAuth();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
